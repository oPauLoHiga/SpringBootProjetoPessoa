# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS — MYSQL
# ==========================================

# URL de conexão: localhost:3306 é o padrão do MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cadastro_pessoas_db}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true

# Usuário do MySQL (use um usuário dedicado em produção!)
spring.datasource.username=${DB_USERNAME:root}
# Senha do MySQL (configurada na instalação)
spring.datasource.password=${DB_PASSWORD:}

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ==========================================

# update: cria/atualiza tabelas automaticamente (ótimo para dev)
# validate: apenas valida, não altera (use em produção)
# create-drop: recria toda vez que iniciar (cuidado!)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Mostrar as queries SQL no console (útil para debug)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Formatar o SQL no console para ficar legível
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.jpa.open-in-view=false

# ==========================================
# CONFIGURAÇÃO DO SERVIDOR
# ==========================================

# Porta da aplicação (padrão: 8080)
server.port=8080

# Sessão segura. Em produção, use SESSION_COOKIE_SECURE=true com HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=CADASTRO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Frontends autorizados a enviar o cookie da sessão.
# APP_FRONTEND_ORIGIN continua aceito para manter compatibilidade.
app.cors.allowed-origins=${APP_FRONTEND_ORIGINS:${APP_FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}}

# O primeiro administrador só é criado quando as duas variáveis são informadas.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Nome da aplicação
spring.application.name=cadastro-pessoas
