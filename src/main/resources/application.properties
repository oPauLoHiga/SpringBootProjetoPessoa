# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS — MYSQL
# ==========================================

# URL de conexão: localhost:3306 é o padrão do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cadastro_pessoas_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true

# Usuário do MySQL (use um usuário dedicado em produção!)
spring.datasource.username=root
# Senha do MySQL (configurada na instalação)
spring.datasource.password=31415

# Driver JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ==========================================

# update: cria/atualiza tabelas automaticamente (ótimo para dev)
# validate: apenas valida, não altera (use em produção)
# create-drop: recria toda vez que iniciar (cuidado!)
spring.jpa.hibernate.ddl-auto=update

# Mostrar as queries SQL no console (útil para debug)
spring.jpa.show-sql=true

# Formatar o SQL no console para ficar legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL para o Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURAÇÃO DO SERVIDOR
# ==========================================

# Porta da aplicação (padrão: 8080)
server.port=8080

# Nome da aplicação
spring.application.name=cadastro-pessoas